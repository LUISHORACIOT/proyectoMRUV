<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Pelota en caída libre con posiciones sucesivas cada vez más separadas y aceleración gravitatoria hacia abajo">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <radialGradient id="pelota" cx="35%" cy="30%">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f97316"/>
    </radialGradient>
    <marker id="flecha" markerWidth="10" markerHeight="10" refX="3" refY="8" orient="auto">
      <path d="M0,0 L6,0 L3,9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#fondo)"/>
  <rect x="0" y="448" width="800" height="52" fill="#cbd5e1"/>
  <rect x="0" y="448" width="800" height="6" fill="#94a3b8"/>

  <line x1="230" y1="52" x2="230" y2="440" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 9"/>

  <g fill="url(#pelota)" stroke="#ea580c" stroke-width="2">
    <circle cx="230" cy="66" r="18" opacity=".2"/>
    <circle cx="230" cy="104" r="18" opacity=".32"/>
    <circle cx="230" cy="160" r="18" opacity=".48"/>
    <circle cx="230" cy="234" r="18" opacity=".68"/>
    <circle cx="230" cy="326" r="18" opacity=".88"/>
    <circle cx="230" cy="430" r="18"/>
  </g>

  <g fill="#64748b" font-family="system-ui, sans-serif" font-size="14">
    <text x="262" y="72" opacity=".6">t₀</text>
    <text x="262" y="110" opacity=".7">t₁</text>
    <text x="262" y="166" opacity=".8">t₂</text>
    <text x="262" y="240" opacity=".9">t₃</text>
    <text x="262" y="332">t₄</text>
  </g>

  <line x1="600" y1="95" x2="600" y2="265" stroke="#dc2626" stroke-width="7" stroke-linecap="round" marker-end="url(#flecha)"/>
  <text x="630" y="175" fill="#991b1b" font-family="Georgia, serif" font-style="italic" font-size="34">g ≈ 9,8 m/s²</text>
  <text x="630" y="210" fill="#475569" font-family="system-ui, sans-serif" font-size="17">aceleración constante hacia abajo</text>

  <g stroke="#f97316" stroke-width="2" fill="none" opacity=".5">
    <path d="M212 430 Q230 412 248 430"/>
  </g>
  <ellipse cx="230" cy="448" rx="34" ry="7" fill="#64748b" opacity=".3"/>
</svg>
